# === PostgreSQL (ative com: --spring.profiles.active=dev) ===
# Aponta para o Postgres da VM Linux. Rodando o backend dentro da propria VM,
# use localhost:5432. Rodando de fora (ex.: Windows), troque por IP_DA_VM:5432.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:armario}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:armario_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console desativado neste profile (nao ha H2).
spring.h2.console.enabled=false
