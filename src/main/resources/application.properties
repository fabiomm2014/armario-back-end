# === H2 (dev/testes) ===
spring.datasource.url=jdbc:h2:mem:armario
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === JWT ===
jwt.secret=chave-secreta-armario-api-deve-ter-pelo-menos-32-caracteres
jwt.expiration-ms=3600000

# === CORS (acesso via celular na rede local) ===
cors.allowed-origin-patterns=http://localhost:5173,http://192.168.*.*:5173,http://10.*.*.*:5173
