# === Configuracao comum a todos os profiles ===
# Profile ativo por padrao: dev (PostgreSQL). A aplicacao SEMPRE conecta no Postgres.
# Requer DB_PASSWORD (sem fallback). Para H2 opcional em dev, use --spring.profiles.active=local.
spring.profiles.active=dev

# === JWT ===
# Segredo externalizado: defina JWT_SECRET (>=32 chars) em producao.
# O fallback abaixo serve apenas para dev local.
jwt.secret=${JWT_SECRET:chave-secreta-armario-api-deve-ter-pelo-menos-32-caracteres}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# === CORS (acesso via celular na rede local) ===
cors.allowed-origin-patterns=http://localhost:5173,http://192.168.*.*:5173,http://10.*.*.*:5173

# === JPA ===
# Desativa Open Session in View (evita queries na renderizacao; boa pratica).
spring.jpa.open-in-view=false
